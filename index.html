  <div id="main-content-wrapper" class="w-full flex-1 flex flex-col items-center">
    <header class="w-full max-w-5xl px-4 py-3 border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button id="secret-admin-trigger" class="relative group p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 transition active:scale-95" title="管理者ツール">
          <i data-lucide="activity" class="w-6 h-6 text-rose-500 transition-transform group-hover:scale-110"></i>
        </button>
        <div class="flex items-center gap-2">
          <h1 class="text-lg md:text-xl font-bold tracking-tight text-white flex items-center gap-2">
            <span>EMS CARD STATION</span>
            <span id="current-mode-badge" class="text-xs px-2 py-0.5 rounded-full bg-cyan-900/60 text-cyan-300 border border-cyan-700">総合ポータル</span>
          </h1>
        </div>
      </div>
    </header>

    <main class="w-full max-w-5xl p-4 flex-1 flex flex-col items-center justify-start relative">
      <section id="view-portal" class="w-full flex flex-col items-center py-6 animate-fade-in">
        <div class="text-center mb-8 max-w-2xl">
          <h2 class="text-2xl md:text-4xl font-extrabold text-white tracking-tight mb-2">訓練ミッションを選択</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full max-w-4xl" id="portal-games-container"></div>
      </section>

      <!-- LOBBY -->
      <section id="view-lobby" class="w-full max-w-xl flex flex-col items-center py-6 hidden animate-fade-in">
        <div class="w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl">
          <h2 id="lobby-mode-title" class="text-xl font-bold text-white mb-4">TITLE</h2>
          <input id="input-player-name" type="text" value="救急隊員" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white mb-4">
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="app.createRoom()" class="w-full bg-rose-700 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl">ルーム作成</button>
            <button onclick="app.startSoloAI()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 rounded-xl">すぐ遊ぶ（AI演習）</button>
          </div>
        </div>
      </section>

      <!-- WAITING ROOM -->
      <section id="view-room" class="w-full max-w-xl flex flex-col items-center py-6 hidden animate-fade-in">
        <div class="w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl">
          <h2 class="text-xl font-bold text-white mb-4">CODE: <span id="room-code-display" class="font-mono text-cyan-400">------</span></h2>
          <button id="btn-start-game" onclick="app.startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-xl">出動開始</button>
        </div>
      </section>

      <!-- GAME TABLE -->
      <section id="view-game" class="w-full flex-1 flex flex-col items-center justify-between hidden">
        <div id="my-cards-container" class="flex gap-2"></div>
      </section>

      <!-- MEMORY GAME TABLE -->
      <section id="view-memory-game" class="w-full flex-1 flex flex-col items-center justify-start hidden animate-fade-in">
        <div id="memory-cards-grid" class="grid grid-cols-8 gap-2"></div>
      </section>
    </main>
  </div>

  <script>
    let socket;
    try { socket = io(); } catch(e) { socket = { emit: () => {}, on: () => {} }; }

    const app = {
      init: () => {
        app.renderPortal();
        app.showScreen('view-portal');
        if (window.lucide) lucide.createIcons();
      },
      showScreen: (id) => {
        ['view-portal', 'view-lobby', 'view-room', 'view-game', 'view-memory-game'].forEach(s => {
          document.getElementById(s)?.classList.toggle('hidden', s !== id);
        });
      },
      returnToPortal: () => { app.showScreen('view-portal'); },
      renderPortal: () => {
        const c = document.getElementById('portal-games-container');
        if(!c) return;
        c.innerHTML = `
          <div onclick="app.selectGame('babanuki')" class="cursor-pointer bg-slate-900 border p-5 rounded-2xl hover:border-cyan-500">
            <h3 class="text-lg font-bold text-white">GAME 01: 不整脈を回避せよ！</h3>
          </div>
          <div onclick="app.selectGame('memory')" class="cursor-pointer bg-slate-900 border p-5 rounded-2xl hover:border-blue-500">
            <h3 class="text-lg font-bold text-white">GAME 02: 救急神経衰弱バトル</h3>
          </div>
        `;
      },
      selectGame: (mode) => {
        state.mode = mode;
        app.showScreen('view-lobby');
      },
      createRoom: () => {
        state.room = { code: Math.floor(100000 + Math.random() * 900000).toString(), isHost: true };
        document.getElementById('room-code-display').textContent = state.room.code;
        state.players = [{ id: state.me.id, name: '救急隊員', isAI: false, hand: [] }];
        app.showScreen('view-room');
      },
      startSoloAI: () => {
        state.room = { code: 'SOLO-AI', isHost: true, isSolo: true };
        state.players = [
          { id: state.me.id, name: '救急隊員', isAI: false, hand: [] },
          { id: 'ai_1', name: BOT_NAME_POOL[0], isAI: true, hand: [] }
        ];
        app.startGame();
      },
      startGame: () => {
        if(state.mode === 'memory') app.startMemoryGameSession();
        else app.startStandardCardGameSession();
      },
      startMemoryGameSession: () => {
        app.showScreen('view-memory-game');
        let allGroups = JSON.parse(JSON.stringify(MEMORY_EXCEL_GROUPS));
        allGroups.sort(() => Math.random() - 0.5);
        let deck = [];
        allGroups.slice(0, 18).forEach(g => {
          deck.push({ group: g.group, title: g.disease, desc: g.q1, isFlipped: false, isMatched: false });
          deck.push({ group: g.group, title: g.disease, desc: g.q2, isFlipped: false, isMatched: false });
        });
        deck.sort(() => Math.random() - 0.5);
        state.memoryState.cards = deck;
        app.renderMemoryGameTable();
      },
      renderMemoryGameTable: () => {
        const grid = document.getElementById('memory-cards-grid');
        if(!grid) return;
        grid.innerHTML = '';
        state.memoryState.cards.forEach((card, idx) => {
          grid.innerHTML += `<div onclick="alert('${utils.escapeHtml(card.title)}')" class="p-2 bg-slate-900 border border-cyan-900 cursor-pointer text-xs">${card.isFlipped ? card.title : 'ECG'}</div>`;
        });
      },
      startStandardCardGameSession: () => {
        app.showScreen('view-game');
      }
    };

    const state = { mode: 'babanuki', me: { id: 'p_1', name: '救急隊員' }, players: [], memoryState: { cards: [] } };
    window.onload = app.init;
  </script>
</body>
</html>
